<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" width="280" height="380">
  <defs>
    <pattern id="crtHeroScan" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00f0ff" stroke-width="0.6" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Sombra Dura Deslocada -->
  <polygon points="8,6 276,2 278,374 4,378" fill="#e60012" />

  <!-- Carcaça Preta (#07090e) com Janela de Arte Vazada (x:14..232, y:42..192) -->
  <path fill-rule="evenodd" d="M 4,2 L 274,4 L 276,374 L 2,376 Z
           M 14,42 L 232,42 L 232,192 L 14,192 Z" fill="#07090e" stroke="#f8fafc" stroke-width="2.5" />

  <path fill-rule="evenodd" d="M 4,2 L 274,4 L 276,374 L 2,376 Z
           M 14,42 L 232,42 L 232,192 L 14,192 Z" fill="url(#crtHeroScan)" />

  <!-- Moldura na Janela de Arte -->
  <rect x="13" y="41" width="220" height="152" fill="none" stroke="#ffe600" stroke-width="2" />
  <polygon points="12,40 36,40 32,46 18,46 18,60 12,64" fill="#e60012" />

  <!-- Cabeçalho Poligonal do Nome do Herói (Centro Y = 21) -->
  <polygon points="12,9 250,7 246,37 8,35" fill="#ffe600" />
  <polygon points="10,6 246,5 242,34 8,33" fill="#faf8f5" stroke="#07090e" stroke-width="2.5" />

  <!-- Selo Octogonal Cyber à Direita do Nome -->
  <polygon points="248,5 270,5 274,20 268,35 244,35 240,20" fill="#07090e" stroke="#f8fafc" stroke-width="2" />
  <circle cx="257" cy="20" r="6" fill="#00f0ff" />

  <!-- ===================================================================== -->
  <!-- TRILHA VERTICAL DE ATIVAÇÃO (x: 234..272, y: 42..192)                 -->
  <!-- ===================================================================== -->
  <rect x="234" y="42" width="38" height="150" fill="#07090e" stroke="#f8fafc" stroke-width="1.5" />
  <line x1="253" y1="54" x2="253" y2="180" stroke="#334155" stroke-width="2.5" />

  <!-- Slot 1 (Y = 62): AO JOGAR / ENTRADA -->
  <polygon points="253,51 264,62 253,73 242,62" fill="#111827" stroke="#475569" stroke-width="1.5" />
  <text x="253" y="65" font-family="monospace" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">⚡</text>

  <!-- Slot 2 (Y = 98): INÍCIO DO COMBATE -->
  <polygon points="245,89 261,89 265,98 261,107 245,107 241,98" fill="#111827" stroke="#475569" stroke-width="1.5" />
  <text x="253" y="101" font-family="monospace" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">☀</text>

  <!-- Slot 3 (Y = 134): AURA / COMBATE -->
  <polygon points="253,123 264,134 253,145 242,134" fill="#111827" stroke="#475569" stroke-width="1.5" />
  <text x="253" y="137" font-family="monospace" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">♾</text>

  <!-- Slot 4 (Y = 170): FINAL DO COMBATE -->
  <polygon points="245,161 261,161 265,170 261,179 245,179 241,170" fill="#111827" stroke="#475569" stroke-width="1.5" />
  <text x="253" y="173" font-family="monospace" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">⏳</text>

  <!-- ===================================================================== -->
  <!-- CAIXA INFERIOR ESQUERDA: TRAITS + DESCRIÇÃO LIVRE (Sem "Capacidade")  -->
  <!-- ===================================================================== -->
  <rect x="8" y="196" width="202" height="176" fill="#faf8f5" stroke="#07090e" stroke-width="2.5" />
  <rect x="10" y="198" width="198" height="31" fill="#e6dec8" />
  <polygon points="10,198 18,198 14,229 10,229" fill="#07090e" />
  <line x1="10" y1="229" x2="208" y2="229" stroke="#07090e" stroke-width="2" />
  <line x1="10" y1="232" x2="140" y2="232" stroke="#00f0ff" stroke-width="2" />

  <!-- Coluna Direita de Atributos Base (x: 214..272, y: 198..372) -->
  <rect x="213" y="196" width="60" height="176" fill="#07090e" stroke="#f8fafc" stroke-width="2" />

  <!-- ESP (Y = 224) -->
  <rect x="215" y="198" width="56" height="42" fill="#f5efe2" />
  <polygon points="215,198 242,198 237,210 215,210" fill="#07090e" />
  <text x="218" y="207" font-family="monospace" font-size="7.5" font-weight="bold" fill="#c084fc">ESP</text>
  <rect x="268" y="198" width="3" height="42" fill="#9333ea" />

  <!-- ATQ (Y = 267) -->
  <rect x="215" y="242" width="56" height="41" fill="#efe9da" />
  <polygon points="215,242 242,242 237,254 215,254" fill="#07090e" />
  <text x="218" y="251" font-family="monospace" font-size="7.5" font-weight="bold" fill="#f87171">ATQ</text>
  <rect x="268" y="242" width="3" height="41" fill="#e60012" />

  <!-- DEF (Y = 310) -->
  <rect x="215" y="285" width="56" height="41" fill="#f5efe2" />
  <polygon points="215,285 242,285 237,297 215,297" fill="#07090e" />
  <text x="218" y="294" font-family="monospace" font-size="7.5" font-weight="bold" fill="#38bdf8">DEF</text>
  <rect x="268" y="285" width="3" height="41" fill="#0284c7" />

  <!-- VIDA (Y = 353) -->
  <rect x="215" y="328" width="56" height="42" fill="#fee2e2" />
  <polygon points="215,328 246,328 241,340 215,340" fill="#e60012" />
  <text x="218" y="337" font-family="monospace" font-size="7.5" font-weight="bold" fill="#ffffff">VIDA</text>
  <rect x="268" y="328" width="3" height="42" fill="#e60012" />
  <line x1="215" y1="328" x2="271" y2="328" stroke="#e60012" stroke-width="2" />
</svg>