  <!-- Célula 4: EMPUNHADURA (Y = 353) -->
  <rect x="215" y="328" width="56" height="42" fill="#090d16" />
  <polygon points="215,328 246,328 241,340 215,340" fill="#ffe600" />
  <text x="218" y="337" font-family="monospace" font-size="7.5" font-weight="bold" fill="#07090e">EMP</text>
