  <polygon points="245,89 261,89 265,98 261,107 245,107 241,98" fill="#111827" stroke="#475569" stroke-width="1.5" />
  <text x="253" y="101" font-family="monospace" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">☀</text>

