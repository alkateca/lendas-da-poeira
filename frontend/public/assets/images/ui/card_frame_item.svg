  <polygon points="14,9 270,7 266,37 10,35" fill="#e60012" />
  <polygon points="10,6 266,5 262,34 8,33" fill="#faf8f5" stroke="#07090e" stroke-width="2.5" />
  <polygon points="8,6 28,6 23,33 8,33" fill="#07090e" />
  <text x="17" y="23" font-family="monospace" font-size="9" font-weight="bold" fill="#00f0ff" text-anchor="middle">>_</text>

  <!-- ===================================================================== -->
  <!-- TRILHA VERTICAL DE ATIVAÇÃO (Acima dos atributos: x:234..272, y:42..192)-->
  <!-- ===================================================================== -->
  <rect x="234" y="42" width="38" height="150" fill="#07090e" stroke="#f8fafc" stroke-width="1.5" />
  <!-- Linha Condutora Vertical da Trilha (X = 253) -->
  <line x1="253" y1="54" x2="253" y2="180" stroke="#334155" stroke-width="2.5" />

  <!-- Slot 1 (Y = 62): AO JOGAR / RESOLUÇÃO -->
  <polygon points="253,51 264,62 253,73 242,62" fill="#111827" stroke="#475569" stroke-width="1.5" />
  <text x="253" y="65" font-family="monospace" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">⚡</text>

