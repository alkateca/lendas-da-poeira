<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" width="280" height="380">
  <defs>
    <pattern id="crtItemScan" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00f0ff" stroke-width="0.6" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Sombra Externa Dura Estilo Persona 5 (com Janela de Arte Vazada) -->
  <path fill-rule="evenodd" d="M 8,6 L 276,2 L 278,374 L 4,378 Z
           M 14,42 L 232,42 L 232,192 L 14,192 Z" fill="#e60012" />

  <!-- Carcaça Principal Preta (#07090e) com Janela de Arte Vazada (x:14..232, y:42..192) -->
  <path fill-rule="evenodd" d="M 4,2 L 274,4 L 276,374 L 2,376 Z
           M 14,42 L 232,42 L 232,192 L 14,192 Z" fill="#07090e" stroke="#f8fafc" stroke-width="2.5" />

  <path fill-rule="evenodd" d="M 4,2 L 274,4 L 276,374 L 2,376 Z
           M 14,42 L 232,42 L 232,192 L 14,192 Z" fill="url(#crtItemScan)" />

  <!-- Moldura e Cantoneiras na Janela de Arte -->
  <rect x="13" y="41" width="220" height="152" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.8" />
  <polygon points="12,40 34,40 30,45 17,45 17,58 12,62" fill="#ffe600" />
  <polygon points="12,194 34,194 30,189 17,189 17,176 12,172" fill="#00f0ff" />

  <!-- ===================================================================== -->
  <!-- TOPO: CABEÇALHO POLIGONAL REBELDE (Centro Y = 21)                     -->
