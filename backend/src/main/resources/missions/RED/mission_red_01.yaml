id: "mission_red_01"
titulo: "O Primeiro Clarão da Forja"
subtitulo: "Arquétipo: Caçadores das Cinzas & Purificação pelo Fogo"
cor: "RED"
capitulo: 1
prologo: |
  Nos ermos do leste, as fornalhas nunca se apagam.
  Os Caçadores das Cinzas aprendem a moldar a Poeira em ferramentas e armadilhas antes mesmo de empunhar uma lâmina.

  Nos Grandes Arquivos, o Eco de Alka desperta em Poeira Branca para testar se sua velocidade tática supera a guarda dos Heróis do Passado.
epilogo: |
  Com o constructo silenciado, a Poeira de fogo assentou revelando o segredo da forja e consagrando seu domínio sobre a Ala das Cinzas.
