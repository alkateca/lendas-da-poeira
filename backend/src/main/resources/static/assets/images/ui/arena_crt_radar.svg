  <!-- Anel de Combate estilo Persona (Arcos Assimétricos) -->
  <circle cx="400" cy="400" r="345" fill="none" stroke="#e60012" stroke-width="4" stroke-dasharray="160,90,80,110" opacity="0.7" />
  <circle cx="400" cy="400" r="260" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="8,12" opacity="0.45" />

  <!-- Eixos de Mira Osciloscópio -->
