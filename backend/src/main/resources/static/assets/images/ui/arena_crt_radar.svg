  <line x1="400" y1="20" x2="400" y2="780" stroke="#00f0ff" stroke-width="1" opacity="0.25" />

  <!-- Estrela / Rosa dos Ventos Assimétrica P5 no Centro -->
  <polygon points="400,310 418,382 490,400 418,418 400,490 382,418 310,400 382,382" fill="none" stroke="#ffe600" stroke-width="2" opacity="0.35" />

  <!-- Textos diegéticos de telemetria -->
