<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="crtGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#e60012" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#050507" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Brilho de fósforo central -->
  <circle cx="400" cy="400" r="380" fill="url(#crtGlow)" />

  <!-- Anel externo tracejado técnico -->
